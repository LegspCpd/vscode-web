<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code Web</title>
    <!-- 网站图标（站点根目录的 usb2.ico） -->
    <link rel="icon" type="image/x-icon" href="./usb2.ico">
    <link rel="apple-touch-icon" href="./usb2.ico">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #1e1e1e; }
        #vscode-workbench { width: 100%; height: 100%; }
        /* ================= 响应式菜单：窄屏折叠为汉堡 ================= */
        
        .menu-hamburger {
            display: none;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 4px; left: 6px;
            width: 34px; height: 28px;
            cursor: pointer;
            background: transparent;
            border: none;
            border-radius: 4px;
            z-index: 13001;
        }
        .menu-hamburger:hover { background: rgba(255,255,255,0.1); }
        /* 三条横线（CSS 伪元素） */
        .menu-hamburger > span,
        .menu-hamburger > span::before,
        .menu-hamburger > span::after {
            content: "";
            display: block;
            width: 18px; height: 2px;
            background: #cccccc;
            border-radius: 1px;
            transition: transform .15s ease, opacity .15s ease;
        }
        .menu-hamburger > span { position: relative; }
        .menu-hamburger > span::before { position: absolute; top: -6px; left: 0; }
        .menu-hamburger > span::after { position: absolute; top: 6px; left: 0; }
        /* 窄屏：隐藏完整菜单栏，仅显示汉堡 */
        @media (max-width: 760px) {
            .menu-hamburger { display: flex; }
            .titlebar-left .menubar { display: none !important; }
            /* 展开态：汉堡下方显示菜单下拉 */
            body.menu-open .titlebar-left .menubar {
                display: flex !important;
                flex-wrap: wrap;
                position: fixed;
                top: 34px; left: 6px;
                max-width: 220px;
                background: #252526;
                border: 1px solid #3c3c3c;
                border-radius: 4px;
                padding: 4px;
                z-index: 13000;
            }
            body.menu-open .menubar .menubar-menu-button {
                flex: 0 0 auto;
                margin: 2px;
            }
        }
        /* ================= GitHub 侧边栏与面板（VS Code 暗色主题配色） ================= */
        .gh-sidebar-btn {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 48px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            z-index: 13003;
        }
        .gh-sidebar-btn:hover { background: rgba(255,255,255,0.12); }
        .gh-sidebar-btn .gh-icon { width: 26px; height: 26px; }
        .gh-sidebar-btn:hover .gh-icon path { fill: #ffffff; }
        .gh-sidebar-btn.active { background: rgba(0,122,204,0.25); }

        .gh-panel {
            position: fixed;
            top: 35px; right: 0; bottom: 24px;
            width: 380px;
            background: #252526;              /* VS Code 侧边栏底色 */
            border-left: 1px solid #1e1e1e;
            box-shadow: -4px 0 16px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            z-index: 20010;
            color: #cccccc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            transform: translateX(100%);
            transition: transform .18s ease;
        }
        .gh-panel.open { transform: translateX(0); }
        .gh-panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px;
            background: #2d2d2d;
            border-bottom: 1px solid #3c3c3c;
            flex: 0 0 auto;
        }
        .gh-panel-title { font-weight: 600; color: #ffffff; font-size: 13px; }
        .gh-panel-header-actions { display: flex; gap: 4px; }
        .gh-btn {
            background: #3c3c3c; color: #ddd;
            border: 1px solid #4a4a4a; border-radius: 4px;
            padding: 6px 12px; cursor: pointer; font-size: 12px;
        }
        .gh-btn:hover { background: #454545; }
        .gh-btn-primary { background: #0e639c; border-color: #0e639c; color: #fff; }
        .gh-btn-primary:hover { background: #1177bb; }
        .gh-btn-sm { padding: 3px 8px; font-size: 12px; }
        .gh-login-btn { width: 100%; padding: 10px; margin: 12px; }
        .gh-auth { padding: 4px; }
        .gh-repo-picker { padding: 10px 12px; border-bottom: 1px solid #3c3c3c; }
        .gh-section-label { font-size: 11px; color: #9d9d9d; margin-bottom: 4px; }
        .gh-select {
            width: 100%; box-sizing: border-box;
            background: #3c3c3c; color: #eee;
            border: 1px solid #3f3f3f; border-radius: 4px;
            padding: 6px 8px; font-size: 12px;
        }
        .gh-select:focus { outline: none; border-color: #007acc; }
        .gh-tabs { display: flex; border-bottom: 1px solid #3c3c3c; }
        .gh-tab {
            background: transparent; border: none; color: #9d9d9d;
            padding: 8px 12px; cursor: pointer; font-size: 12px; border-bottom: 2px solid transparent;
        }
        .gh-tab:hover { color: #fff; }
        .gh-tab.is-active { color: #fff; border-bottom-color: #007acc; }
        .gh-tree, .gh-preview { flex: 1 1 auto; overflow: auto; padding: 6px 4px; }
        .gh-tree-file, .gh-tree-folder {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 8px; cursor: pointer; color: #cccccc; font-size: 12.5px;
        }
        .gh-tree-file:hover, .gh-tree-folder:hover { background: rgba(255,255,255,0.06); }
        .gh-tree-folder-root { font-weight: 600; color: #fff; }
        .gh-indent { margin-left: 14px; }
        .gh-preview pre {
            background: #1e1e1e; color: #d4d4d4; padding: 10px;
            border-radius: 4px; margin: 8px; white-space: pre-wrap; word-break: break-word;
            font-family: 'Cascadia Code', Consolas, monospace; font-size: 12px; max-height: 70vh; overflow: auto;
        }
        .gh-footer { flex: 0 0 auto; border-top: 1px solid #3c3c3c; padding: 8px 12px; }
        .gh-footer-status { font-size: 11px; color: #9d9d9d; }
        .gh-empty { color: #9d9d9d; padding: 12px; font-size: 12.5px; }
    </style>
    <!-- 工作台样式（注意：本裁剪版实际文件名是 workbench.web.main.internal.css） -->
    <link rel="stylesheet" href="./vs/workbench/workbench.web.main.internal.css">
</head>
<body class="web">

    <!-- GitHub 面板（弹出容器，暗色底色与 VS Code 一致） -->
    <div id="gh-panel" class="gh-panel" aria-hidden="true">

    <!-- 语言检测（同步，先于消息表加载）：根据系统/浏览器语言选择简体/繁体中文或英文 -->
    <script>
        (function () {
            try {
                var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en-US'];
                var raw = (langs[0] || '').toLowerCase().replace('_', '-');
                var q = new URLSearchParams(window.location.search).get('lang');
                var loc;
                if (q) {
                    var ql = q.toLowerCase();
                    if (ql.indexOf('zh') === 0) { loc = (ql.indexOf('tw') > 0 || ql.indexOf('hant') > 0) ? 'zh-tw' : 'zh-cn'; }
                    else if (ql === 'en') { loc = 'en'; }
                    else { loc = ql; }
                } else if (raw.indexOf('zh') === 0) {
                    loc = (raw.indexOf('tw') > 0 || raw.indexOf('hant') > 0 || raw.indexOf('hk') > 0) ? 'zh-tw' : 'zh-cn';
                } else {
                    // 默认就是简体中文（除非显式指定 ?lang=en / ?lang=zh-tw）
                    loc = 'zh-cn';
                }
                // 关键：设置全局语言，供后续 module 脚本复用
                window.__VSCODE_LOCALE__ = loc;
                // 根据语言加载对应的 NLS 消息表（每个文件设置 globalThis._VSCODE_NLS_MESSAGES）
                if (loc === 'zh-cn') {
                    document.write('<script src="./nls.messages.zh-cn.js"><\/script>');
                } else if (loc === 'zh-tw') {
                    document.write('<script src="./nls.messages.zh-tw.js"><\/script>');
                } else {
                    document.write('<script src="./nls.messages.js"><\/script>');
                }
            } catch (e) {
                document.write('<script src="./nls.messages.js"><\/script>');
            }
        })();
    </script>

    <!-- 启动脚本：本构建通过 ES Module 调用导出的 create() 来启动工作台 -->
    <script type="module">
        (async function () {
            // 资源根路径
            globalThis._VSCODE_FILE_ROOT = window.location.origin + '/';

            // ---------- 语言：复用上面同步检测的结果（默认 zh-cn 简体中文）----------
            const locale = window.__VSCODE_LOCALE__ || 'zh-cn';
            globalThis._VSCODE_NLS_LANGUAGE = locale;

            const container = document.getElementById('vscode-workbench');

            // 产品配置：名称 + 扩展市场（Open VSX）
            const productConfiguration = {
                nameShort: 'Code - Web',
                nameLong: 'Visual Studio Code Web',
                applicationName: 'code-web',
                dataFolderName: '.vscode-web',
                urlProtocol: 'code-web',
                // 版本号必须与真实构建一致（1.133.0），否则扩展的 engines.vscode
                // 兼容性检查（>= 某版本）会因为版本过低而拒绝安装！
                version: '1.133.0',
                commit: undefined,
                quality: 'stable',
                // Open VSX 官方推荐的 VS Code 兼容端点（Use Open VSX in VS Code）
                // 必须使用 /vscode/unpkg 作为资源模板，否则扩展 manifest 抓取失败、无法安装！
                extensionsGallery: {
                    serviceUrl: 'https://open-vsx.org/vscode/gallery',
                    itemUrl: 'https://open-vsx.org/vscode/item',
                    // 不设置 controlUrl：Open VSX 没有 control manifest 端点，
                    // 不设置时 getExtensionsControlManifest 直接返回空清单，不报错。
                    resourceUrlTemplate: 'https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}',
                    extensionUrlTemplate: 'https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest'
                },
                // 信任 open-vsx，避免打开扩展详情时被链接保护拦截
                linkProtectionTrustedDomains: [
                    'https://open-vsx.org'
                ]
            };

            // GitHub / Git 能力说明：
            // 这个裁剪版没有内置扩展目录，Git / GitHub 能力需要通过扩展获得。
            // 扩展市场（Open VSX）已配置好，用户可直接在“扩展”面板搜索并安装：
            //   - Git      ：搜索 “git” 安装 “Git (built-in)”
            //   - GitHub   ：搜索 “GitHub Pull Requests” 安装（依赖 GitHub 认证）
            // 注意 GitHub.remotehub（打开 GitHub 仓库）未发布到 Open VSX，
            // 打开仓库主要依靠克隆（git 命令）或 GitHub PR 扩展。

            // 说明：中文界面由上方根据语言加载的 nls.messages.zh-cn.js / zh-tw.js
            // 消息表直接提供（94.8% 覆盖），无需额外的内置语言包扩展，
            // 从而避免语言包作为内置扩展加载时反复请求不存在的 package.nls.json。

            // 密钥存储 provider（用于安全持久化 GitHub token 等敏感信息）
            // 基于浏览器 IndexedDB 的简单实现，避免 token 裸露在 localStorage。
            const secretStorageProvider = (() => {
                const DB = 'vscode-web-secrets';
                const STORE = 'secrets';
                let dbPromise;
                function db() {
                    if (!dbPromise) {
                        dbPromise = new Promise((resolve, reject) => {
                            const req = indexedDB.open(DB, 1);
                            req.onupgradeneeded = () => {
                                if (!req.result.objectStoreNames.contains(STORE)) {
                                    req.result.createObjectStore(STORE);
                                }
                            };
                            req.onsuccess = () => resolve(req.result);
                            req.onerror = () => reject(req.error);
                        });
                    }
                    return dbPromise;
                }
                return {
                    async get(key) {
                        const d = await db();
                        return new Promise((resolve, reject) => {
                            const tx = d.transaction(STORE, 'readonly');
                            const rq = tx.objectStore(STORE).get(key);
                            rq.onsuccess = () => resolve(rq.result || undefined);
                            rq.onerror = () => reject(rq.error);
                        });
                    },
                    async set(key, value) {
                        const d = await db();
                        return new Promise((resolve, reject) => {
                            const tx = d.transaction(STORE, 'readwrite');
                            tx.objectStore(STORE).put(value, key);
                            tx.oncomplete = () => resolve();
                            tx.onerror = () => reject(tx.error);
                        });
                    },
                    async delete(key) {
                        const d = await db();
                        return new Promise((resolve, reject) => {
                            const tx = d.transaction(STORE, 'readwrite');
                            tx.objectStore(STORE).delete(key);
                            tx.oncomplete = () => resolve();
                            tx.onerror = () => reject(tx.error);
                        });
                    }
                };
            })();

            // 动态 import 工作台主模块并启动
            const { create } = await import('./vs/workbench/workbench.web.main.internal.js');

            try {
                create(container, {
                    // 产品配置（名称 + 扩展市场等）
                    productConfiguration,

                    // 默认设置：顶部显示完整菜单栏（文件/编辑/视图...）
                    // 窄屏响应式折叠为汉堡菜单由下方自定义 CSS 处理
                    configurationDefaults: {
                        'window.menuBarVisibility': 'classic'
                    },

                    // 默认暗色主题（web 端默认是亮色 LIGHT，必须显式设为 dark）
                    // 并在 loading 阶段直接应用暗色初始颜色，避免白屏/白色闪屏
                    initialColorTheme: {
                        themeType: 'dark',
                        colors: {
                            'editor.background': '#1e1e1e',
                            'editorGroupHeader.tabsBackground': '#252526',
                            'workbench.background': '#1e1e1e',
                            'sideBar.background': '#252526',
                            'activityBar.background': '#333333',
                            'titleBar.activeBackground': '#3c3c3c',
                            'statusBar.background': '#007acc',
                            'panel.background': '#1e1e1e',
                            'menubar.selectionBackground': '#333333'
                        }
                    },

                    // 工作区提供者：初始为空窗口（欢迎页）。
                    workspaceProvider: {
                        workspace: { workspaceUri: undefined, folderUri: undefined },
                        trusted: true,
                        async open(workspace, options) {
                            return true;
                        }
                    },

                    // 密钥存储（GitHub token 持久化）
                    secretStorageProvider,

                    // 额外的信任域（避免链接被拦截）
                    additionalTrustedDomains: [
                        'open-vsx.org',
                        'github.com',
                        '*.github.com',
                        'raw.githubusercontent.com',
                        '*.vscode-cdn.net',
                        '*.vscode-unpkg.net'
                    ],

                    // 打开本地文件时浏览器 File System Access API 端点
                    // （VSCode 内部在支持该 API 的浏览器上会自动注册 file: scheme provider）
                    webviewEndpoint: undefined // 使用内置默认的 vscode-cdn.net webview 端点
                });

                console.log('[vscode-web] workbench.create() invoked.');

                // ================= GitHub 远程仓库（OAuth + 浏览/编辑） =================
                // Client ID 前端可公开；Client Secret 由 /api/auth/callback.js 在服务端换取 token。
                // 所有 GitHub 请求经 /api/proxy 代理（避免 CORS，token 不暴露给第三方）。
                (function initGitHub() {

                    // --- 配置 ---
                    // Client ID 可公开（GitHub 允许）；Secret 只在服务端 /api/auth/callback.js（经环境变量）
                    const CLIENT_ID = 'Ov23liDtRHzVSs0Pued6';
                    const ORIGIN = window.location.origin;
                    const TOKEN_KEY = 'gh_auth';          // 与 /api/auth/callback 写入的 key 一致

                    // --- 元素 ---
                    const btn = document.getElementById('gh-sidebar-btn');
                    const panel = document.getElementById('gh-panel');
                    const authEl = document.getElementById('gh-auth');
                    const loginBtn = document.getElementById('gh-login');
                    const repoPicker = document.getElementById('gh-repo-picker');
                    const repoSelect = document.getElementById('gh-repo-select');
                    const tabsEl = document.getElementById('gh-tabs');
                    const treeEl = document.getElementById('gh-tree');
                    const previewEl = document.getElementById('gh-preview');
                    const statusEl = document.getElementById('gh-status');
                    const footerEl = document.querySelector('.gh-footer');
                    const refreshBtn = document.getElementById('gh-refresh');
                    const closeBtn = document.getElementById('gh-close');
                    const tabBtns = document.querySelectorAll('.gh-tab');

                    // --- 状态 ---
                    let token = null;
                    let username = null;
                    let repos = [];
                    let currentRepo = null;
                    let currentBranch = 'main';
                    let treeCache = [];       // [{type, path, sha}]
                    let currentFilePath = null;
                    let currentFileSha = null;

                    // --- 会话读写（localStorage）---
                    function loadSession() {
                        try {
                            const s = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null');
                            token = (s && s.token) || null;
                        } catch (e) { token = null; }
                    }
                    function saveToken(t) {
                        try {
                            localStorage.setItem(TOKEN_KEY, JSON.stringify({ token: t, time: Date.now() }));
                        } catch (e) {}
                        token = t;
                    }
                    function clearToken() {
                        try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
                        token = null;
                    }

                    // --- 面板开关 ---
                    function openPanel() {
                        panel.classList.add('open');
                        panel.setAttribute('aria-hidden', 'false');
                        btn.classList.add('active');
                        refreshView();
                    }
                    function closePanel() {
                        panel.classList.remove('open');
                        panel.setAttribute('aria-hidden', 'true');
                        btn.classList.remove('active');
                    }
                    function togglePanel() {
                        if (panel.classList.contains('open')) closePanel(); else openPanel();
                    }

                    // --- GitHub API（经 /api/proxy）---
                    async function gh(url, opts) {
                        const o = opts || {};
                        const headers = { 'Authorization': 'Bearer ' + token };
                        if (o.headers) Object.assign(headers, o.headers);
                        if (o.body !== undefined) headers['Content-Type'] = 'application/json';
                        const res = await fetch('/api/proxy' + url, {
                            method: o.method || 'GET',
                            headers,
                            body: o.body !== undefined ? (typeof o.body === 'string' ? o.body : JSON.stringify(o.body)) : undefined
                        });
                        const text = await res.text();
                        let data;
                        try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
                        return { ok: res.ok, status: res.status, data };
                    }

                    // --- 视图刷新（登录态 + 仓库）---
                    async function refreshView() {
                        loadSession();
                        if (!token) {
                            treeEl.innerHTML = '';
                            authEl.hidden = false;
                            repoPicker.hidden = true;
                            tabsEl.hidden = true;
                            previewEl.innerHTML = '';
                            treeEl.hidden = true;
                            footerEl.hidden = true;
                            return;
                        }
                        authEl.hidden = true;
                        // 获取用户信息（可选）并拉仓库
                        try {
                            const u = await gh('/user');
                            if (u.ok) username = u.data.login;
                        } catch (e) {}
                        await loadRepos();
                    }

                    async function loadRepos() {
                        repoPicker.hidden = true;
                        treeEl.innerHTML = '<div class="gh-empty">加载仓库…</div>';
                        treeEl.hidden = false;
                        try {
                            const r = await gh('/user/repos?per_page=100&sort=updated');
                            if (!r.ok) { throw new Error('无法读取仓库：' + (r.data && r.data.message || r.status)); }
                            repos = r.data;
                            repoSelect.innerHTML = repos.map(repo =>
                                '<option value="' + repo.full_name + '">' + repo.full_name + (repo.private ? ' 🔒' : '') + '</option>'
                            ).join('');
                            repoPicker.hidden = false;
                            treeEl.innerHTML = '<div class="gh-empty">请选择一个仓库</div>';
                            // 若已选过仓库，重新加载
                            if (currentRepo) {
                                const match = repos.find(x => x.full_name === currentRepo);
                                if (match) { openRepoTree(match); }
                            }
                        } catch (err) {
                            treeEl.innerHTML = '<div class="gh-empty">' + (err.message || '加载失败') + '</div>';
                            setStatus(err.message || 'error');
                        }
                    }

                    // --- 仓库文件树 ---
                    async function openRepoTree(repo) {
                        currentRepo = repo.full_name;
                        currentBranch = repo.default_branch || 'main';
                        currentFilePath = null; currentFileSha = null;
                        tabsEl.hidden = false;
                        treeEl.hidden = false;
                        previewEl.innerHTML = ''; previewEl.hidden = true;
                        setTab('tree');
                        treeEl.innerHTML = '<div class="gh-tree-folder gh-tree-folder-root">' + repo.full_name + '</div><div class="gh-empty">加载文件树…</div>';
                        try {
                            const t = await gh('/repos/' + repo.full_name + '/git/trees/' + currentBranch + '?recursive=1');
                            if (!t.ok) {
                                // 回退：只列根目录
                                treeEl.innerHTML = '<div class="gh-empty">无法加载文件树：' + ((t.data && t.data.message) || t.status) + '</div>';
                                return;
                            }
                            treeCache = (t.data.tree || []).filter(x => x.type === 'blob').map(x => ({ path: x.path, sha: x.sha }));
                            renderTree();
                        } catch (err) {
                            treeEl.innerHTML = '<div class="gh-empty">' + (err.message || '加载失败') + '</div>';
                        }
                    }

                    function renderTree() {
                        treeEl.innerHTML = '<div class="gh-tree-folder gh-tree-folder-root">' + currentRepo + ' (分支 ' + currentBranch + ')</div>';
                        const sorted = treeCache.slice().sort((a, b) => {
                            const dirA = a.path.split('/').length, dirB = b.path.split('/').length;
                            if (dirA !== dirB) return dirA - dirB;
                            return a.path.localeCompare(b.path);
                        });
                        sorted.forEach(f => {
                            const parts = f.path.split('/');
                            const depth = parts.length - 1;
                            const div = document.createElement('div');
                            div.className = 'gh-tree-file' + (depth > 0 ? ' gh-indent' : '');
                            div.style.paddingLeft = (8 + depth * 14) + 'px';
                            div.textContent = '📄 ' + parts[parts.length - 1];
                            div.title = f.path;
                            div.addEventListener('click', () => openFile(f.path, f.sha));
                            treeEl.appendChild(div);
                            // 占位显示文件夹层级（用缩进表示）
                        });
                        if (sorted.length === 0) treeEl.innerHTML += '<div class="gh-empty">（空仓库）</div>';
                    }

                    // --- 打开文件（取内容 → 填入编辑器/预览） ---
                    async function openFile(path, sha) {
                        currentFilePath = path; currentFileSha = sha;
                        setTab('preview');
                        previewEl.hidden = false;
                        previewEl.innerHTML = '<pre>加载 ' + path + ' …</pre>';
                        try {
                            const c = await gh('/repos/' + currentRepo + '/contents/' + encodeURIComponent(path) + '?ref=' + currentBranch);
                            if (!c.ok) {
                                previewEl.innerHTML = '<pre>无法读取文件：' + ((c.data && c.data.message) || c.status) + '</pre>';
                                return;
                            }
                            // Base64 解码内容
                            let content = '';
                            if (c.data.encoding === 'base64') {
                                content = decodeBase64(c.data.content);
                            } else if (typeof c.data.content === 'string') {
                                content = c.data.content;
                            }
                            renderFileEditor(path, content, c.data.sha);
                        } catch (err) {
                            previewEl.innerHTML = '<pre>错误：' + (err.message || err) + '</pre>';
                        }
                    }

                    function renderFileEditor(path, content, sha) {
                        currentFileSha = sha;
                        previewEl.innerHTML = '';
                        const title = document.createElement('div');
                        title.className = 'gh-empty';
                        title.textContent = path;
                        const ta = document.createElement('textarea');
                        ta.value = content;
                        ta.style.cssText = 'width:100%;box-sizing:border-box;min-height:60vh;background:#1e1e1e;color:#d4d4d4;border:1px solid #3f3f3f;border-radius:4px;padding:10px;font-family:Consolas,monospace;font-size:12px;resize:vertical;';
                        const row = document.createElement('div');
                        row.style.cssText = 'display:flex;gap:8px;padding:8px 12px;';
                        const saveBtn = document.createElement('button');
                        saveBtn.className = 'gh-btn gh-btn-primary';
                        saveBtn.textContent = '保存并提交到 GitHub';
                        const backBtn = document.createElement('button');
                        backBtn.className = 'gh-btn';
                        backBtn.textContent = '返回文件树';
                        backBtn.addEventListener('click', () => { setTab('tree'); });
                        saveBtn.addEventListener('click', () => saveFile(path, ta.value, sha));
                        row.appendChild(saveBtn);
                        row.appendChild(backBtn);
                        previewEl.appendChild(title);
                        previewEl.appendChild(ta);
                        previewEl.appendChild(row);
                        previewEl.scrollTop = 0;
                    }

                    async function saveFile(path, newContent, oldSha) {
                        setStatus('正在提交…');
                        try {
                            const commitMessage = 'Update ' + path + ' [via vscode-web]';
                            const res = await gh('/repos/' + currentRepo + '/contents/' + encodeURIComponent(path), {
                                method: 'PUT',
                                body: {
                                    message: commitMessage,
                                    content: encodeToBase64(newContent),
                                    sha: oldSha,
                                    branch: currentBranch
                                }
                            });
                            if (!res.ok) {
                                throw new Error(((res.data && res.data.message) || ('HTTP ' + res.status)));
                            }
                            setStatus('✅ 已提交到 ' + currentBranch + '：' + path);
                            // 更新当前文件 sha
                            if (res.data && res.data.content && res.data.content.sha) currentFileSha = res.data.content.sha;
                            else currentFileSha = null;
                        } catch (err) {
                            setStatus('❌ 提交失败：' + (err.message || err));
                        }
                    }

                    // --- 工具函数 ---
                    function decodeBase64(b64) {
                        // 先还原 GitHub 的换行
                        const clean = b64.replace(/\s+/g, '');
                        try {
                            const bin = atob(clean);
                            const bytes = new Uint8Array(bin.length);
                            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                            return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
                        } catch (e) { return clean; }
                    }
                    function encodeToBase64(str) {
                        const bytes = new TextEncoder().encode(str);
                        let bin = '';
                        bytes.forEach(b => bin += String.fromCharCode(b));
                        return btoa(bin);
                    }
                    function setTab(name) {
                        tabBtns.forEach(t => t.classList.toggle('is-active', t.dataset.tab === name));
                        if (name === 'tree') {
                            treeEl.hidden = false; previewEl.hidden = true;
                            if (treeCache.length && currentRepo) renderTree();
                        } else {
                            treeEl.hidden = true; previewEl.hidden = false;
                        }
                    }
                    function setStatus(s) { if (statusEl) { statusEl.textContent = s; footerEl.hidden = false; } }

                    // --- 登录（OAuth）---
                    function startLogin() {
                        if (!CLIENT_ID) {
                            alert('GitHub Client ID 未配置。');
                            return;
                        }
                        const state = 'gh_' + Date.now();
                        const redirectUri = ORIGIN + '/api/auth/callback?origin=' + encodeURIComponent(ORIGIN) + '&state=' + state;
                        const url = 'https://github.com/login/oauth/authorize'
                            + '?client_id=' + CLIENT_ID
                            + '&redirect_uri=' + encodeURIComponent(redirectUri)
                            + '&scope=repo'   // repo：读写仓库（含私有）
                            + '&state=' + state;
                        window.location.href = url;
                    }

                    // --- 事件绑定 ---
                    btn.addEventListener('click', (ev) => { ev.stopPropagation(); togglePanel(); });
                    closeBtn.addEventListener('click', closePanel);
                    loginBtn.addEventListener('click', startLogin);
                    refreshBtn.addEventListener('click', () => { loadSession(); if (token) loadRepos(); });
                    repoSelect.addEventListener('change', () => {
                        const repo = repos.find(x => x.full_name === repoSelect.value);
                        if (repo) openRepoTree(repo);
                    });
                    tabBtns.forEach(t => t.addEventListener('click', () => setTab(t.dataset.tab)));

                    // 初始化
                    loadSession();
                    refreshView();
                })();

                // 窄屏汉堡菜单交互：点击展开/收起，点击外部关闭
                const hamburger = document.getElementById('menu-hamburger');
                if (hamburger) {
                    hamburger.addEventListener('click', (ev) => {
                        ev.stopPropagation();
                        document.body.classList.toggle('menu-open');
                    });
                    document.addEventListener('click', () => {
                        document.body.classList.remove('menu-open');
                    });
                    // 点击菜单项后关闭下拉
                    document.querySelectorAll('.menubar-menu-button').forEach(el => {
                        el.addEventListener('click', () => document.body.classList.remove('menu-open'));
                    });
                }
            } catch (err) {
                console.error('[vscode-web] Failed to start workbench:', err);
                container.innerHTML = '<div style="color:#fff;font-family:sans-serif;padding:20px;">启动失败：' +
                    String(err && err.message ? err.message : err) + '</div>';
            }
        })();
    </script>
</body>
