<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code Web</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #1e1e1e; }
        #vscode-workbench { width: 100%; height: 100%; }
    </style>
</head>
<body class="web">
    <div id="vscode-workbench"></div>

    <!-- 1. 加载官方打包出来的核心 CSS -->
    <link rel="stylesheet" href="./vs/workbench/workbench.web.main.css">

    <!-- 2. 初始化全局配置对象 (设置必要的配置参数，避免 404/加载报错) -->
    <script>
        window._VSCODE_FILE_ROOT = unescape(window.location.pathname).replace(/\/index\.html$/, '');
        window.product = {
            nameShort: "Code - Web",
            nameLong: "Visual Studio Code Web",
            applicationName: "code-web",
            dataFolderName: ".vscode-web",
            urlProtocol: "code-web",
            webEndpointUrl: window.location.origin
        };
        window.vscode = {
            process: { env: {} }
        };
    </script>

    <!-- 3. 直接加载主工程文件 (内部包含模块初始化，不需要外部 require) -->
    <script src="./vs/workbench/workbench.web.main.js"></script>
</body>
</html>
