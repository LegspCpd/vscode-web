<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code Web</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #1e1e1e; }
        #vscode-workbench { width: 100%; height: 100%; }
    </style>
    <!-- 引入正确的路径（加上 out/ 或对应的真实层级） -->
    <link rel="stylesheet" href="./out/vs/workbench/workbench.web.main.css">
</head>
<body class="web">
    <div id="vscode-workbench"></div>

    <script>
        window.product = {
            nameShort: "Code - Web",
            nameLong: "Visual Studio Code Web",
            applicationName: "code-web",
            dataFolderName: ".vscode-web",
            urlProtocol: "code-web",
            webEndpointUrl: window.location.origin
        };
    </script>
    <!-- 指向真实的 js 路径 -->
    <script src="./out/vs/workbench/workbench.web.main.js"></script>
</body>
</html>
